[package]
name = "wallet-core"
description = "Kyro wallet core: BIP39/BIP32 derivation, encrypted vault, BTC/LTC/DOGE/EVM/Solana/TRON/XRP/Cardano/Sui signing. Pure, no I/O."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "wallet_core"

[dependencies]
# Mnemonics (rust-bitcoin). `zeroize` wipes word indices on drop.
bip39 = { version = "=2.2.2", default-features = false, features = ["std", "zeroize", "unicode-normalization"] }
# BIP32 / PSBT / Taproot / addresses / secp256k1 (libsecp256k1 bindings).
bitcoin = { version = "=0.32.11", default-features = false, features = ["std", "base64", "secp-recovery"] }
# EVM: RLP (alloy-rlp, no crypto deps), Keccak-256 (RustCrypto sha3), 256-bit integers
# (parity `uint`). ECDSA is libsecp256k1 via `bitcoin::secp256k1` (`secp-recovery` above).
# alloy-consensus/alloy-primitives are NOT used: their optional `k256` dependency lands in
# Cargo.lock (k256 -> crypto-bigint 0.5, RUSTSEC-2026-0387) even when the feature is off.
alloy-rlp = { version = "=0.3.16", default-features = false, features = ["std"] }
sha3 = { version = "=0.10.9", default-features = false, features = ["std"] }
uint = { version = "=0.10.0", default-features = false, features = ["std"] }
# Solana: ed25519 + SLIP-10 derivation (the crate used by solana-sdk).
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize", "hazmat"] }
ed25519-dalek-bip32 = { version = "=0.3.0" }
bs58 = { version = "=0.5.1" }
# Cardano (CIP-1852 / Icarus). BIP32-Ed25519 (Khovratovich-Law) derivation: IOHK-lineage crate
# used by CML / CSL / pallas-wallet; its only dependency, cryptoxide, is pinned below 0.6.7
# (published 2026-10-21, < 2 weeks old). Signatures are made and verified by ed25519-dalek
# (`hazmat::raw_sign` with the extended scalar), not by cryptoxide.
ed25519-bip32 = { version = "=0.5.0" }
cryptoxide = { version = "=0.6.6" }
# Icarus master key: PBKDF2-HMAC-SHA512 (RustCrypto; hmac / sha2 already in the tree).
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
hmac = { version = "=0.12.1" }
sha2 = { version = "=0.10.9", default-features = false }
# Cardano hashes: blake2b-224 (key hashes) and blake2b-256 (transaction id). Already in the tree.
blake2 = { version = "=0.10.6", default-features = false }
curve25519-dalek = { version = "=4.1.3", default-features = false }
# Vault.
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
getrandom = { version = "=0.2.17", features = ["std"] }
zeroize = { version = "=1.8.2", features = ["std"] }
# Plumbing.
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145" }
base64 = { version = "=0.22.1" }
hex = { version = "=0.4.3" }
thiserror = { version = "=2.0.18" }

[dev-dependencies]
# Differential tests only: decode the same devnet messages with Anza's reference crate.
solana-message = { version = "=5.1.0", default-features = false, features = ["wincode"] }
wincode = { version = "=0.6.3", default-features = false, features = ["std"] }
