[workspace]
resolver = "2"
members = ["crates/wallet-core", "apps/desktop/src-tauri"]
# Vendored third-party crate (see [patch.crates-io]); not a Kyro workspace member.
exclude = ["apps/desktop/src-tauri/vendor"]

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/kyro-wallet/kyro"
rust-version = "1.85"

[profile.release]
# Smaller, more reproducible binaries; panics abort so no unwinding through secret-holding frames.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev.package."*"]
# Argon2id with production parameters is unusably slow without optimisations, even in debug builds.
opt-level = 2

[patch.crates-io]
# arti 0.47 hangs forever on Windows (saturating-time 0.5.0 `find_limit`, rust-lang/rust#149995).
# Backport of the fix already on arti `main`; see apps/desktop/src-tauri/vendor/saturating-time/Cargo.toml.
saturating-time = { path = "apps/desktop/src-tauri/vendor/saturating-time" }
