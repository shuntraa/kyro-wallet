[package]
name = "kyro-desktop"
description = "Kyro Wallet — coque Tauri (session, réseau filtré, confirmations natives)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "kyro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[features]
default = []
# Compact block filters (BIP157/158) Bitcoin backend. Off by default.
cbf = ["dep:bip157", "dep:tor-socksproto"]

[dependencies]
wallet-core = { path = "../../../crates/wallet-core", version = "=0.1.0" }
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
zeroize = "1"
base64 = "0.22"
dotenvy = "0.15"
# Embedded Tor (B2a). rustls + ring only (no native-tls, no aws-lc-rs), SQLite compiled in.
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "static-sqlite", "compression", "onion-service-client"] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
# HTTP/1.1 over Tor streams: tokio-rustls (webpki roots) + hyper 1.
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http = { version = "=1.5.0" }
http-body-util = { version = "=0.1.5" }
bytes = { version = "=1.12.1" }
tokio = { version = "=1.54.1", default-features = false, features = ["time", "sync", "rt", "net", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = { version = "=1.0.11" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
# B2b: Electrum certificate pinning (SHA-256 of the DER certificate), hex fingerprints.
sha2 = { version = "=0.10.9" }
hex = { version = "=0.4.3" }
# B2c: BIP157/158 compact block filters. OPTIONAL, behind the `cbf` feature (off by default)
# until bip157 0.8.1 is >= 2 weeks old and re-reviewed (see docs/ROADMAP.md).
bip157 = { version = "=0.8.1", default-features = false, optional = true }
# Same versions as already in the tree (no new crate): SOCKS5 server-side parsing for the CBF
# bridge (arti's own parser), and bitcoin types for block/transaction handling.
tor-socksproto = { version = "=0.47.0", default-features = false, features = ["proxy-handshake"], optional = true }
# Bitcoin types (CBF blocks, PSBTs for hardware wallets). Same version as wallet-core.
bitcoin = { version = "=0.32.11", default-features = false, features = ["std", "base64"] }
# Onion v3 checksum (SHA3-256), already in the tree via wallet-core.
sha3 = { version = "=0.10.9" }
# B3: hardware wallets (see docs/IPC.md §2.3 and SECURITY.md).
# Ledger: USB HID. hidapi compiles its vendored C backend on Windows/macOS (no system
# library), and the pure-Rust hidraw backend on Linux (no libudev needed).
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-native-basic-udev"] }
# Ledger's official client for the Bitcoin app v2 (PSBT + wallet policies). Transport is ours.
# `paranoid_client` (miniscript) is off: Kyro checks every address and signature itself.
ledger_bitcoin_client = { version = "=0.7.0", default-features = false }
# Trezor's official Rust crate (trezor-firmware repo): protobuf messages and wire framing.
# Its own USB enumeration/transport is not used (infinite read timeout, panics on libusb
# errors); Kyro drives rusb with bounded timeouts and cancellation.
trezor-client = { version = "=0.1.6", default-features = false, features = ["bitcoin", "ethereum", "solana"] }
protobuf = { version = "=3.7.2" }
rusb = { version = "=0.9.4" }
# Force the vendored, statically linked libusb (else macOS links Homebrew's dylib if present).
libusb1-sys = { version = "=0.7.0", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Pinned below 0.1.3 (published 2026-10-23, < 2 weeks old); pulled by hidapi's Linux backend.
basic-udev = { version = "=0.1.2" }

[dev-dependencies]
# Only for the #[ignore]d real-network Tor test (KYRO_TOR_TRACE=<filter> shows arti logs).
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
