# cargo-deny : licences compatibles GPL, pas de crates yankées, sources connues uniquement.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" only fails for our direct dependencies:
# transitive ones from Tauri/alloy (paste, proc-macro-error, derivative) are tracked upstream.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  # hex_lit (via rust-bitcoin): MIT plus a "no false attribution" clause — permissive.
  "MITNFA",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
