# cargo-deny: GPL-compatible licenses, no yanked crates, known sources only.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" only fails for our direct dependencies:
# transitive ones from Tauri/alloy (paste, proc-macro-error, derivative) are tracked upstream.
unmaintained = "workspace"
ignore = [
  # rsa 0.9 (Marvin attack: timing leak in RSA *private-key* operations). Pulled by arti
  # (tor-llcrypto, ssh-key-fork-arti). A Tor client only uses RSA *public* keys, to verify
  # directory/relay signatures; arti documents that "Tor clients never actually need RSA
  # private keys", and we never create or load one. No fixed rsa release exists yet.
  { id = "RUSTSEC-2023-0071", reason = "arti client: RSA signature verification only, no private-key operation" },
  # crypto-bigint 0.5 (non-constant-time operations). Pulled only by monero-ed25519 0.1 (monero-oxide);
  # no release of it on crypto-bigint >= 0.7.6 yet. All Monero computation runs locally in the desktop
  # process: a remote node cannot time it. Re-checked 2026-11-02: monero-wallet 0.2.0, monero-oxide 0.1.0, monero-ed25519 0.1.0 are the latest releases and crypto-bigint 0.5.5 is the last 0.5.x (no patched 0.5 release). Re-check on every monero-oxide update.
  { id = "RUSTSEC-2026-0387", reason = "monero-oxide only, local computation; waiting for an upstream release on crypto-bigint >= 0.7.6" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  # hex_lit (via rust-bitcoin): MIT plus a "no false attribution" clause — permissive.
  "MITNFA",
]
# async_executors (arti's runtime abstraction) is public-domain-style "Unlicense", GPL-compatible.
# Allowed for that crate only.
exceptions = [
  { name = "async_executors", allow = ["Unlicense"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
